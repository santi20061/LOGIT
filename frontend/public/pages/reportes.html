<section class="reportes-container">
  <div class="page-heading">
    <div>
      <span class="eyebrow">Análisis</span>
      <h2>Informes y estadísticas</h2>
      <p>Consulta la distribución de recursos y exporta tus datos.</p>
    </div>
  </div>

  <div class="grid grid-2">
    <section class="card">
      <div class="card-header"><h3 class="card-title">Paquetes por estado</h3></div>
      <div class="card-body"><div id="reportePaquetesEstado"></div></div>
    </section>
    <section class="card">
      <div class="card-header"><h3 class="card-title">Vehículos por estado</h3></div>
      <div class="card-body"><div id="reporteVehiculosEstado"></div></div>
    </section>
    <section class="card">
      <div class="card-header"><h3 class="card-title">Conductores por estado</h3></div>
      <div class="card-body"><div id="reporteConductoresEstado"></div></div>
    </section>
    <section class="card">
      <div class="card-header"><h3 class="card-title">Rutas por estado</h3></div>
      <div class="card-body"><div id="reporteRutasEstado"></div></div>
    </section>
  </div>

  <section class="card">
    <div class="card-header"><h3 class="card-title">Exportar datos</h3></div>
    <div class="card-body">
      <p class="export-description">Descarga los registros en formato CSV para analizarlos en una hoja de cálculo.</p>
      <div class="btn-group">
        <button class="btn btn-secondary" type="button" onclick="exportarClientesCSV()">Clientes</button>
        <button class="btn btn-secondary" type="button" onclick="exportarPaquetesCSV()">Paquetes</button>
        <button class="btn btn-secondary" type="button" onclick="exportarVehiculosCSV()">Vehículos</button>
        <button class="btn btn-secondary" type="button" onclick="exportarConductoresCSV()">Conductores</button>
        <button class="btn btn-secondary" type="button" onclick="exportarRutasCSV()">Rutas</button>
        <button class="btn btn-secondary" type="button" onclick="exportarEntregasCSV()">Entregas</button>
      </div>
    </div>
  </section>
</section>
